
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <label for="input">Enter The Money:</label>
    <br>
    <input type="text" name="input" id="input">
    <br>

    <label for="select_from">From:</label>
    <select name="select_from" id="select_from">
        <option value="EGP">EGP - Egyptian Pound</option>
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="SAR">SAR - Saudi Riyal</option>
        <option value="AED">AED - UAE Dirham</option>
        <option value="KWD">KWD - Kuwaiti Dinar</option>
        <option value="QAR">QAR - Qatari Riyal</option>
        <option value="JOD">JOD - Jordanian Dinar</option>
        <option value="CAD">CAD - Canadian Dollar</option>
        <option value="AUD">AUD - Australian Dollar</option>
        <option value="CHF">CHF - Swiss Franc</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="CNY">CNY - Chinese Yuan</option>
        <option value="INR">INR - Indian Rupee</option>
        <option value="TRY">TRY - Turkish Lira</option>
        <option value="RUB">RUB - Russian Ruble</option>
        <option value="ZAR">ZAR - South African Rand</option>
    </select>

    <label for="select_to">To:</label>
    <select name="select_to" id="select_to">
        <option value="EGP">EGP - Egyptian Pound</option>
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="SAR">SAR - Saudi Riyal</option>
        <option value="AED">AED - UAE Dirham</option>
        <option value="KWD">KWD - Kuwaiti Dinar</option>
        <option value="QAR">QAR - Qatari Riyal</option>
        <option value="JOD">JOD - Jordanian Dinar</option>
        <option value="CAD">CAD - Canadian Dollar</option>
        <option value="AUD">AUD - Australian Dollar</option>
        <option value="CHF">CHF - Swiss Franc</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="CNY">CNY - Chinese Yuan</option>
        <option value="INR">INR - Indian Rupee</option>
        <option value="TRY">TRY - Turkish Lira</option>
        <option value="RUB">RUB - Russian Ruble</option>
        <option value="ZAR">ZAR - South African Rand</option>
    </select>

    <br>

    <label for="output">The Result of Conversion:</label>
    <br>
    <input type="text" name="output" id="output" disabled>

    <script src="main.js"></script>

</body>

</html>
